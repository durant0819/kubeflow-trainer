apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: pytorch-runtime-4070ti
spec:
  mlPolicy:
    torch: {}
  template:
    spec:
      replicatedJobs:
        - name: trainer
          replicas: 1
          template:      # 这一层是 JobSpec
            spec:        # 这是 JobSpec 的 spec
              template:  # 这一层是 PodTemplate (必需字段)
                spec:    # 这是 PodSpec
                  containers:
                    - name: train-container
                      image: kubeflow/pytorch-dist-mnist-test:latest
                      imagePullPolicy: IfNotPresent
                      resources:
                        limits:
                          nvidia.com/gpu: 1
                        requests:
                          cpu: "2"
                          memory: "4Gi"
                  restartPolicy: OnFailure
