apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: pytorch-runtime-4070ti
spec:
  mlPolicy:
    torch: {}
  template:
    spec:
      replicatedJobs:
        - name: trainer
          replicas: 1
          template:      # 这一层是 JobSpec
            spec:        # 这是 JobSpec 的 spec
              template:  # 这一层是 PodTemplate (必需字段)
                spec:    # 这是 PodSpec
                  containers:
                    - name: train-container
                      image: docker.m.daocloud.io/kubeflow/pytorch-dist-mnist:v1-9121e6a
                      imagePullPolicy: IfNotPresent
                      volumeMounts:
                      - name: mnist-script-volume
                        mountPath: /opt/mnist/src/mnist.py
                        subPath: mnist.py
                      resources:
                        limits:
                          nvidia.com/gpu: 1
                        requests:
                          cpu: "2"
                          memory: "4Gi"
                  restartPolicy: OnFailure
                  volumes:
                  - name: mnist-script-volume
                    configMap:
                      name: mnist-cm
